# CPU 使用率(starship に組み込みモジュールが無いためカスタムコマンド)
# /proc/loadavg の1分平均をコア数で割った概算値
[custom.cpu]
command = "awk -v c=$(nproc) '{printf \"%.0f%%\", $1/c*100}' /proc/loadavg"
when = true
symbol = "󰻠 "
style = "bold dimmed white"
format = "[$symbol$output]($style) "
