"$schema" = 'https://starship.rs/config-schema.json'

# ~/.config/starship.toml — starship プロンプト設定
# ドキュメント: https://starship.rs/config/
#
# nerd-font-symbols プリセットをベースに、カスタム設定をマージしたもの。
# 端末フォントに Nerd Font (例: JetBrainsMono Nerd Font) が必要です。

add_newline = true          # プロンプト間に空行を入れる

# 1行目の右端に CPU・メモリ使用率と時刻を表示
# (bash は right_format 非対応のため fill で右寄せ)
format = "$all$fill${custom.cpu}$memory_usage$time$line_break$character"

[fill]
symbol = " "                # 左側と時刻の間を空白で埋める

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 2000             # 2秒以上かかったコマンドは実行時間を表示

[time]
disabled = false            # 1行目右端に日付・時刻を表示(不要なら true に)
time_format = "%m/%d %H:%M:%S"
format = "[󰥔 $time]($style)"  # 時計アイコン(Nerd Font)+ 日付・時刻

[status]
disabled = false            # コマンド失敗時に終了コードを表示
symbol = " "
format = "[$symbol$status]($style) "

